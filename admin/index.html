<!-- LOGIN -->
<div id="login" class="login-wrap">
  <form class="login-card" id="loginForm">
    <div class="logo"><img class="admin-logo" src="../assets/img/LOGO-HORI-BRA.png" onerror="this.onerror=null;this.src='https://static.wixstatic.com/media/837beb_b9d0229eec144443a8c5b28950c17874~mv2.png/v1/fill/w_550,h_130,al_c,q_90,enc_auto/logo.png'" alt="Cia do Corpo"></div>
    <p class="sub">Painel administrativo</p>
    <div class="field"><label>Usuário</label><input id="lg-user" autocomplete="username" value="admin"></div>
    <div class="field"><label>Senha</label><input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn primary" style="width:100%;justify-content:center" type="submit">Entrar</button>
    <div class="err" id="lg-err"></div>
    <p class="sub" style="margin:16px 0 0;font-size:.8rem">Acesso local de demonstração. Troque a senha em Configurações após o primeiro login.</p>
  </form>
</div>
